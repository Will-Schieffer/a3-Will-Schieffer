<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js' defer></script>
    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap' rel='stylesheet'>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body class='app-shell'>
    <h1 class='page-title'>Will Schieffer's Recipe Pinner</h1>

    <form id='recipeForm' class='recipe-form'>
      <input id='title' placeholder='Recipe name' required>
      <input id='url' placeholder='Recipe URL' required>
      <select id='category' required>
        <option value='Breakfast'>Breakfast</option>
        <option value='Lunch'>Lunch</option>
        <option value='Dinner'>Dinner</option>
        <option value='Snack'>Snack</option>
        <option value='Dessert'>Dessert</option>
        <option value='Other'>Other</option>
      </select>
      <button id='submit' type='submit'>Save</button>
    </form>

    <ul id='recipeList' class='recipe-list'></ul>
  </body>
</html>
